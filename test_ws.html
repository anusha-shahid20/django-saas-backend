<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h2>WebSocket Console Check</h2>
    <p>Press F12 to open Developer Tools and see the output.</p>
    
    <script>
        console.log("Connecting...");
        const ws = new WebSocket("ws://127.0.0.1:8000/ws/chat/general/");
        
        ws.onopen = () => {
            console.log("✅ Connected successfully!");
            ws.send(JSON.stringify({ message: "Hello from browser!" }));
        };
        
        ws.onmessage = (event) => {
            console.log("📩 Received:", event.data);
        };
        
        ws.onerror = (error) => {
            console.error("❌ Error:", error);
        };
    </script>
</body>
</html>
